<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="WebSemantic">
  <!-- The WebSemantic mark (docs/logo.png): an equilateral triangle of three nodes, the navy core at its centre -->
  <rect x="3" y="3" width="94" height="94" rx="20" fill="#fff" stroke="#1f3a5f" stroke-width="4"/>
  <g stroke="#b8c2cf" stroke-width="2">
    <line x1="50" y1="27.5" x2="24.02" y2="72.5"/><line x1="50" y1="27.5" x2="75.98" y2="72.5"/><line x1="24.02" y1="72.5" x2="75.98" y2="72.5"/>
  </g>
  <g stroke="#1f3a5f" stroke-width="5">
    <line x1="50" y1="57.5" x2="50" y2="27.5"/><line x1="50" y1="57.5" x2="24.02" y2="72.5"/><line x1="50" y1="57.5" x2="75.98" y2="72.5"/>
  </g>
  <circle cx="50" cy="27.5" r="10" fill="#3b7dd8"/>
  <circle cx="24.02" cy="72.5" r="10" fill="#2a9d8f"/>
  <circle cx="75.98" cy="72.5" r="10" fill="#e07b3f"/>
  <circle cx="50" cy="57.5" r="13" fill="#1f3a5f"/>
</svg>
