<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebSemantic</title>
  <meta name="description" content="Talk to scientific codes that ask before they compute: road-tunnel electricity demand and radiotherapy dose equivalence, in English or French.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=0.3.6">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
</head>
<body>
  <header class="head">
    <img class="mark" src="logo.svg" alt="" width="40" height="40">
    <div>
      <h1>WebSemantic <span id="tagline"></span></h1>
      <p id="intro"></p>
    </div>
    <a class="affiliation" href="https://www.oie.minesparis.psl.eu/" target="_blank" rel="noopener"
       title="Centre O.I.E. (Observation, Impacts, Énergie), Mines Paris – PSL"><img src="mines-paris-psl-oie.png"
       alt="Mines Paris – PSL, centre O.I.E." width="225" height="51"></a>
  </header>

  <nav class="switches">
    <div class="seg" id="lang">
      <button data-v="en" class="on">English</button><button data-v="fr">Français</button>
    </div>
    <div class="seg" id="code">
      <button data-v="tls" class="on"></button><button data-v="lql"></button>
    </div>
  </nav>

  <main class="grid">
    <section class="left">
      <div id="chat" class="chat" aria-live="polite"></div>
      <form id="form" class="composer">
        <textarea id="input" rows="2"></textarea>
        <button type="button" id="mic" class="icon" title="Voice" aria-label="Voice" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><line x1="12" y1="18" x2="12" y2="21"/><line x1="8" y1="21" x2="16" y2="21"/></svg></button>
        <button type="submit" id="send" class="primary">→</button>
      </form>
      <div class="examples"><div class="row"><span id="examples-label"></span><button type="button" class="more" id="more-examples"></button></div><div id="examples"></div></div>
      <div class="actions">
        <button id="example-btn"></button>
        <button id="reset-btn"></button>
      </div>
      <p id="status" class="status"></p>
    </section>

    <section class="right">
      <div id="decision" class="decision" hidden></div>
      <div class="tabs" role="tablist">
        <button data-tab="results" class="on" id="tab-results"></button>
        <button data-tab="variables" id="tab-variables">Variables</button>
        <button data-tab="about" id="tab-about"></button>
      </div>
      <div id="results" class="pane">
        <div id="kpis" class="kpis"></div>
        <figure id="fig1" class="fig"></figure>
        <figure id="fig2" class="fig"></figure>
        <p id="analysis" class="analysis"></p>
        <div id="provenance" class="provenance"></div>
        <div id="files" class="files"></div>
      </div>
      <div id="variables" class="pane" hidden><table id="vars"></table></div>
      <div id="about" class="pane about" hidden></div>
    </section>
  </main>

  <footer id="footer" class="foot"></footer>
  <script src="app.js?v=0.3.6"></script>
</body>
</html>
