software:
  name: Tunnel Load Simulator
  version: v1.0.1+748e053
  repository: https://github.com/cyrilvoyant/tunnel-load-simulator
  commit: 748e053e129669cf3e896d381e3c0ac01c763edd
  doi: 10.5281/zenodo.20080042
  licence: MIT
  entry_point: tunnel_load_simulator.simulator:run_monte_carlo
  config_class: tunnel_load_simulator.simulator:TunnelConfig
nature: synthetic, first-order Monte Carlo generator; not calibrated against measured tunnels
inputs:
  length_m:
    type: float
    unit: unit:M
    bounds:
      min_exclusive: 0
      authority: code
    label: Longueur
    display_unit: m
    definition: Longueur du tunnel commune aux tubes ; convertie en kilomètres pour les charges proportionnelles
      à la longueur.
    default: 1500
    unit_aliases:
    - m
    - metre
    - metres
    - mètre
    - mètres
    evidence_conversion:
      units:
        km: 1000
        kilometre: 1000
        kilometres: 1000
        m: 1
        metre: 1
        metres: 1
      word_numbers:
        un: 1
        une: 1
        deux: 2
        trois: 3
        quatre: 4
        cinq: 5
        six: 6
        sept: 7
        huit: 8
        neuf: 9
        dix: 10
    quantity_kind: length
    model_component: geometry
    scope_note: Ne pas multiplier la longueur par le nombre de tubes ; ce facteur est appliqué séparément.
    aliases:
    - longueur du tunnel
    reference_implementation: simulator.py:simulate_one_realization
  n_tubes:
    type: int
    unit: unit:NUM
    bounds:
      min: 1
      max: 8
      authority: code
    label: Tubes
    display_unit: nombre
    definition: Nombre de tubes ; multiplie les charges de ventilation et d’auxiliaires et contribue au
      nombre total de voies.
    default: 2
    unit_aliases:
    - null
    - unit:UNITLESS
    - tubes
    - voies
    - nombre
    - number
    - count
    - '1'
    - réalisations
    - realisations
    quantity_kind: count
    model_component: geometry
    scope_note: Un tube est distinct d’une voie de circulation.
    aliases:
    - nombre de tubes
    reference_implementation: simulator.py:simulate_one_realization
  n_lanes_per_tube:
    type: int
    unit: unit:NUM
    bounds:
      min: 1
      max: 6
      authority: code
    label: Voies par tube
    display_unit: nombre
    definition: Nombre de voies dans chaque tube ; l’éclairage est dimensionné sur n_tubes × n_lanes_per_tube.
    default: 2
    unit_aliases:
    - null
    - unit:UNITLESS
    - tubes
    - voies
    - nombre
    - number
    - count
    - '1'
    - réalisations
    - realisations
    quantity_kind: count
    model_component: geometry
    scope_note: Ne pas fournir le nombre total de voies à la place du nombre par tube.
    aliases:
    - nombre de voies par tube
    reference_implementation: simulator.py:simulate_one_realization
  altitude_m:
    type: float
    unit: unit:M
    label: Altitude
    display_unit: m
    definition: 'Altitude utilisée dans le facteur de ventilation : 1 + max(altitude_m − 500, 0)/6000.'
    default: 300
    unit_aliases:
    - m
    - metre
    - metres
    - mètre
    - mètres
    quantity_kind: length
    model_component: ventilation
    scope_note: Le référentiel altimétrique n’est pas déclaré par le modèle ; l’altitude de la commune
      ne fixe pas celle du tunnel.
    aliases:
    - altitude du tunnel
    reference_implementation: simulator.py:simulate_one_realization
  max_depth_m:
    type: float
    unit: unit:M
    label: Couverture maximale
    display_unit: m
    definition: 'Profondeur maximale utilisée pour les auxiliaires : facteur 1 + min(max_depth_m, 800)/6000.'
    default: 80
    unit_aliases:
    - m
    - metre
    - metres
    - mètre
    - mètres
    quantity_kind: length
    model_component: auxiliaries
    scope_note: Le plafonnement de l’effet à 800 m n’est pas une limite géométrique de validité physique.
    aliases:
    - profondeur maximale
    reference_implementation: simulator.py:simulate_one_realization
  gradient_percent:
    type: float
    unit: unit:PERCENT
    label: Pente
    display_unit: '%'
    definition: Pente en pourcentage, utilisée dans le facteur de ventilation 1 + abs(gradient_percent)/20.
    default: 2.0
    unit_aliases:
    - '%'
    - percent
    - pourcent
    - pourcentage
    quantity_kind: percentage
    model_component: ventilation
    scope_note: Une pente de 2 % se saisit 2, pas 0,02 ; l’adaptateur courant demande une valeur non négative.
    aliases:
    - pente du tunnel
    reference_implementation: simulator.py:simulate_one_realization
  tunnel_context:
    type: category
    values:
    - urban
    - peri-urban
    - rural
    authority: code
    label: Contexte
    display_unit: catégorie
    definition: Catégorie appliquant un multiplicateur au profil de trafic ; urban ajoute également une
      composante de pointe en soirée.
    default: peri-urban
    unit_aliases:
    - null
    - ''
    - '1'
    - sans dimension
    - sans unité
    - unit:UNITLESS
    - None
    - 'null'
    - catégorie
    - categorie
    - category
    - categorical
    quantity_kind: category
    model_component: traffic
    scope_note: Le contexte n’est pas une commune et ne constitue pas une calibration du trafic.
    aliases:
    - contexte du tunnel
    reference_implementation: simulator.py:simulate_one_realization
  lighting_type:
    type: category
    values:
    - LED adaptive
    - LED fixed
    - mixed
    - sodium fixed
    authority: code
    label: Éclairage
    display_unit: catégorie
    definition: Catégorie déterminant la puissance spécifique installée, le couplage au trafic et la fraction
      minimale d’éclairage.
    default: LED adaptive
    unit_aliases:
    - null
    - ''
    - '1'
    - sans dimension
    - sans unité
    - unit:UNITLESS
    - None
    - 'null'
    - catégorie
    - categorie
    - category
    - categorical
    quantity_kind: category
    model_component: lighting
    scope_note: Même les catégories fixed ont une modulation horaire dans ce modèle ; aucun éclairement
      en lux n’est calculé.
    aliases:
    - type d’éclairage
    reference_implementation: simulator.py:simulate_one_realization
  ventilation_type:
    type: category
    values:
    - natural/low ventilation
    - longitudinal
    - semi-transverse
    - transverse
    authority: code
    label: Ventilation
    display_unit: catégorie
    definition: Catégorie déterminant la charge de ventilation par kilomètre et par tube, modulée par
      trafic, altitude, pente et événements.
    default: longitudinal
    unit_aliases:
    - null
    - ''
    - '1'
    - sans dimension
    - sans unité
    - unit:UNITLESS
    - None
    - 'null'
    - catégorie
    - categorie
    - category
    - categorical
    quantity_kind: category
    model_component: ventilation
    scope_note: Il s’agit d’une charge électrique synthétique, pas d’un débit d’air ni d’une vérification
      de sécurité.
    aliases:
    - type de ventilation
    reference_implementation: simulator.py:simulate_one_realization
  aux_kw_per_km_tube:
    type: float
    unit: unit:KiloW per km per tube
    label: Auxiliaires
    display_unit: kW/(km·tube)
    definition: Charge de référence des auxiliaires en kW/(km·tube), multipliée par la longueur, les tubes
      et le facteur de profondeur.
    default: 35.0
    unit_aliases:
    - kW par km et par tube
    - kW/(km.tube)
    - kW/(km·tube)
    - kW/km/tube
    quantity_kind: linear_power_per_tube
    model_component: auxiliaries
    scope_note: Ne pas confondre cette charge linéique avec une énergie ; un bruit propre aux auxiliaires
      est ajouté par TLS.
    aliases:
    - charge des auxiliaires
    reference_implementation: simulator.py:simulate_one_realization
  base_fixed_kw:
    type: float
    unit: unit:KiloW
    label: Charge fixe
    display_unit: kW
    definition: Puissance fixe ajoutée une seule fois à la demande totale du tunnel, avant le bruit multiplicatif
      global.
    default: 40.0
    unit_aliases:
    - kW
    - kilowatt
    - kilowatts
    - kw
    quantity_kind: power
    model_component: base_load
    scope_note: Cette puissance concerne l’ensemble du tunnel, pas chaque tube.
    aliases:
    - charge fixe
    reference_implementation: simulator.py:simulate_one_realization
  traffic_level:
    type: float
    unit: unit:UNITLESS
    note: relative multiplier
    label: Trafic relatif
    display_unit: '1'
    definition: Multiplicateur du profil synthétique de trafic normalisé ; l’indice final est borné entre
      0 et 2 dans TLS.
    default: 1.0
    unit_aliases:
    - null
    - '1'
    - unit:NUM
    - sans dimension
    - dimensionless
    - UNITLESS
    quantity_kind: dimensionless_multiplier
    model_component: traffic
    scope_note: Ce paramètre n’est ni un débit en véhicules/heure ni un trafic journalier observé.
    aliases:
    - niveau de trafic
    reference_implementation: simulator.py:simulate_one_realization
  morning_peak_hour:
    type: float
    unit: unit:HR
    label: Pointe du matin
    display_unit: h du jour
    definition: Heure du centre du pic gaussien du matin, comprise entre 0 inclus et 24 exclu.
    default: 8.0
    unit_aliases:
    - h
    - h du jour
    - heure
    - heures
    - hour
    - hours
    quantity_kind: time_of_day
    model_component: traffic
    scope_note: Heure du calendrier simulé ; aucun fuseau horaire ni changement d’heure n’est modélisé.
    aliases:
    - pointe du matin
    reference_implementation: simulator.py:simulate_one_realization
  evening_peak_hour:
    type: float
    unit: unit:HR
    label: Pointe du soir
    display_unit: h du jour
    definition: Heure du centre du pic gaussien du soir, comprise entre 0 inclus et 24 exclu.
    default: 18.0
    unit_aliases:
    - h
    - h du jour
    - heure
    - heures
    - hour
    - hours
    quantity_kind: time_of_day
    model_component: traffic
    scope_note: Heure du calendrier simulé ; aucun fuseau horaire ni changement d’heure n’est modélisé.
    aliases:
    - pointe du soir
    reference_implementation: simulator.py:simulate_one_realization
  peak_width_h:
    type: float
    unit: unit:HR
    label: Largeur des pics
    display_unit: h
    definition: Écart-type temporel du pic gaussien du matin en heures ; TLS utilise 1,15 fois cette valeur
      pour le soir.
    default: 1.4
    unit_aliases:
    - h
    - h du jour
    - heure
    - heures
    - hour
    - hours
    quantity_kind: duration
    model_component: traffic
    scope_note: Ce n’est pas la durée totale de la pointe ni sa largeur à mi-hauteur.
    aliases:
    - largeur des pointes
    reference_implementation: simulator.py:simulate_one_realization
  traffic_sensitivity:
    type: float
    unit: unit:UNITLESS
    label: Sensibilité au trafic
    display_unit: '1'
    definition: 'Coefficient du trafic dans la charge de ventilation : facteur 0,15 + traffic_sensitivity
      × traffic_index.'
    default: 0.65
    unit_aliases:
    - null
    - '1'
    - unit:NUM
    - sans dimension
    - dimensionless
    - UNITLESS
    quantity_kind: dimensionless_coefficient
    model_component: ventilation
    scope_note: Coefficient de modèle ; ce n’est pas une élasticité mesurée de consommation.
    aliases:
    - sensibilité au trafic
    reference_implementation: simulator.py:simulate_one_realization
  noise_sigma:
    type: float
    unit: unit:UNITLESS
    bounds:
      min: 0
      authority: code
    label: Bruit multiplicatif
    display_unit: '1'
    definition: Écart-type du bruit gaussien relatif appliqué à la puissance totale ; la puissance résultante
      est ramenée au minimum à zéro.
    default: 0.06
    unit_aliases:
    - null
    - '1'
    - unit:NUM
    - sans dimension
    - dimensionless
    - UNITLESS
    quantity_kind: relative_standard_deviation
    model_component: stochastic
    scope_note: 'D’autres tirages restent actifs même si noise_sigma=0 : trafic quotidien, auxiliaires
      et événements.'
    aliases:
    - bruit relatif
    reference_implementation: simulator.py:simulate_one_realization
  pollution_probability_per_day:
    type: float
    unit: unit:UNITLESS
    bounds:
      min: 0
      max: 1
      authority: code
    label: Probabilité de pollution
    display_unit: '1'
    definition: Probabilité journalière de tirer un événement synthétique de pollution ; TLS tire ensuite
      son début et sa durée.
    default: 0.05
    unit_aliases:
    - null
    - '1'
    - unit:NUM
    - sans dimension
    - dimensionless
    - UNITLESS
    quantity_kind: daily_event_probability
    model_component: stochastic
    scope_note: Une valeur de 0,05 signifie une probabilité de 5 % par jour, pas un taux de pollution
      ni une concentration.
    aliases:
    - probabilité de pollution
    reference_implementation: simulator.py:simulate_one_realization
  accident_probability_per_day:
    type: float
    unit: unit:UNITLESS
    bounds:
      min: 0
      max: 1
      authority: code
    label: Probabilité d'accident
    display_unit: '1'
    definition: Probabilité journalière de tirer un événement synthétique d’accident ; TLS tire ensuite
      son début et sa durée.
    default: 0.015
    unit_aliases:
    - null
    - '1'
    - unit:NUM
    - sans dimension
    - dimensionless
    - UNITLESS
    quantity_kind: daily_event_probability
    model_component: stochastic
    scope_note: Ce n’est pas une fréquence d’accident par véhicule ni une statistique directement déduite
      de BAAC.
    aliases:
    - probabilité d’accident
    reference_implementation: simulator.py:simulate_one_realization
  pollution_sensitivity:
    type: float
    unit: unit:UNITLESS
    label: Sensibilité pollution
    display_unit: '1'
    definition: 'Coefficient de surcroît de ventilation lorsqu’un événement de pollution est actif : ajout
      à 1 + pollution_sensitivity × indicateur.'
    default: 0.55
    unit_aliases:
    - null
    - '1'
    - unit:NUM
    - sans dimension
    - dimensionless
    - UNITLESS
    quantity_kind: dimensionless_coefficient
    model_component: ventilation
    scope_note: Quand les deux événements sont actifs, leurs coefficients s’ajoutent ; aucune dispersion
      atmosphérique n’est simulée.
    aliases:
    - sensibilité à la pollution
    reference_implementation: simulator.py:simulate_one_realization
  accident_sensitivity:
    type: float
    unit: unit:UNITLESS
    label: Sensibilité accidents
    display_unit: '1'
    definition: Coefficient de surcroît de ventilation lorsqu’un accident est actif ; il s’ajoute au coefficient
      de pollution dans le même facteur.
    default: 0.75
    unit_aliases:
    - null
    - '1'
    - unit:NUM
    - sans dimension
    - dimensionless
    - UNITLESS
    quantity_kind: dimensionless_coefficient
    model_component: ventilation
    scope_note: Ce paramètre ne représente ni la gravité ni le coût énergétique complet d’un accident
      réel.
    aliases:
    - sensibilité aux accidents
    reference_implementation: simulator.py:simulate_one_realization
experiment:
  start_date:
    type: date
    label: Début
    display_unit: date
    definition: Date de début au format YYYY-MM-DD ; détermine le calendrier, les jours de semaine et
      les saisons du modèle.
    default: '2025-01-01'
    unit_aliases:
    - null
    - ''
    - '1'
    - sans dimension
    - sans unité
    - unit:UNITLESS
    - None
    - 'null'
    - date
    - YYYY-MM-DD
    - ISO8601
    quantity_kind: calendar_date
    model_component: experiment
    scope_note: Pas de fuseau déclaré ; le profil de lumière saisonnier est celui du modèle, pas une éphéméride
      du site.
    aliases:
    - date de début
    reference_implementation: simulator.py:run_monte_carlo
  n_days:
    type: int
    unit: unit:DAY
    bounds:
      min: 1
      authority: policy
    label: Durée
    display_unit: jours
    definition: Nombre de jours entiers simulés à partir de start_date.
    default: 7
    unit_aliases:
    - day
    - days
    - j
    - jour
    - jours
    quantity_kind: duration_days
    model_component: experiment
    scope_note: L’annualisation utilise 365/n_days ; 365 jours ne couvrent pas une année civile bissextile
      complète.
    aliases:
    - durée de simulation
    reference_implementation: simulator.py:run_monte_carlo
  freq_minutes:
    type: int
    unit: unit:MIN
    bounds:
      min: 1
      authority: policy
    label: Pas de calcul
    display_unit: min
    definition: Durée constante du pas interne ; l’énergie du pas vaut puissance × freq_minutes/60.
    default: 60
    unit_aliases:
    - min
    - minute
    - minutes
    quantity_kind: duration_minutes
    model_component: experiment
    scope_note: 'Pas admis : 5, 10, 15, 30 ou 60 min. Une sortie quotidienne est une agrégation, pas un
      calcul à minuit.'
    aliases:
    - pas temporel
    - pas interne
    reference_implementation: simulator.py:run_monte_carlo
  n_runs:
    type: int
    unit: unit:NUM
    bounds:
      min: 1
      authority: policy
    label: Réalisations
    display_unit: nombre
    definition: Nombre de réalisations Monte Carlo indépendantes ; chaque réalisation utilise base_seed
      + son indice.
    default: 3
    unit_aliases:
    - null
    - unit:UNITLESS
    - tubes
    - voies
    - nombre
    - number
    - count
    - '1'
    - réalisations
    - realisations
    quantity_kind: count
    model_component: experiment
    scope_note: Augmenter ce nombre décrit mieux la variabilité du modèle, sans ajouter une validation
      terrain.
    aliases:
    - nombre de réalisations
    reference_implementation: simulator.py:run_monte_carlo
  base_seed:
    operational_default: true
    operational_default_source: 'Politique de reproductibilité des essais : graine initiale fixe à 42,
      modifiable sur demande explicite.'
    aliases:
    - seed
    - graine aléatoire
    type: int
    bounds:
      min: 0
      authority: policy
    label: Graine
    display_unit: identifiant
    definition: Identifiant initial du générateur pseudo-aléatoire ; chaque réalisation utilise base_seed
      + run.
    default: 42
    unit_aliases:
    - null
    - ''
    - '1'
    - sans dimension
    - sans unité
    - unit:UNITLESS
    - None
    - 'null'
    - identifiant
    - identifier
    - id
    - nombre
    - number
    - unit:NUM
    display_hidden: true
    quantity_kind: identifier
    model_component: operational
    scope_note: Valeur fixe 42 selon la politique d’essai, modifiable explicitement ; ce n’est pas un
      paramètre physique.
    reference_implementation: simulator.py:run_monte_carlo
outputs:
  daily: derived daily energy sum (kWh) and mean power (kW) of realization 0, not ensemble median
  representative: time series of run 0, load decomposition
  kpis: one row per Monte Carlo run (annual energy uses 365/n_days extrapolation)
  envelope: hourly median, p10, p90 and mean of total power across runs
  season_profiles: mean hourly profile per season, hour and run
tasks:
  supported:
  - estimate electricity demand (energy, peak, load factor) of a road tunnel under stated assumptions
  - compare configurations (lighting, ventilation, traffic) with controlled seeds
  - characterise stochastic variability from modelled events
  excluded:
  - certify design values or predict consumption of a real tunnel without calibration
  - infer traffic in vehicles per day
uncertainty:
  covered:
  - multiplicative noise
  - daily traffic variability
  - pollution and accident events
  not_covered:
  - parameter uncertainty
  - structural model error
  - calibration error
validity_notes:
- short-period annualisation (365/n_days) differs from seasonally complete simulation
- engineering constants are placeholders to calibrate against measured data
profile:
  source: TLS interface defaults @748e053; experiment websemantic quick-demo-v1 (7 days, hourly, 3 runs)
runtime:
  adapter: websemantic.adapters.tls:run
  backend_path: external/tunnel-load-simulator
  backend_marker: src/tunnel_load_simulator/simulator.py
presentation:
  primary_fields:
  - inputs.length_m
  - inputs.n_tubes
  - inputs.n_lanes_per_tube
  - inputs.tunnel_context
  - inputs.lighting_type
  - inputs.ventilation_type
  - inputs.traffic_level
  - experiment.start_date
  - experiment.n_days
  - experiment.freq_minutes
  - experiment.n_runs
  namespace: websemantic.tls
  short_name: TLS
  summary_title: Tunnel
  summary_fields:
  - length_m
  - n_tubes
  - n_lanes_per_tube
  events:
  - accident_probability_per_day
  - pollution_probability_per_day
  help_examples: /set inputs.length_m 2000; /set experiment.n_days 365
  web_example: CETU rôle de la ventilation et de l’éclairage dans la consommation électrique d’un tunnel
  uncertainty_text: p10–p90 décrit la dispersion entre trajectoires simulées, pas un intervalle de confiance.
    Le modèle couvre bruit, trafic et événements ; erreurs de paramètres, de structure et de calibration
    ne sont pas couvertes. L’annualisation extrapole la période.
  event_suggestion:
  - Comprendre les hypothèses d’accidents et de pollution.
  - /events
  suggestions:
  - - 'Préciser l’objectif : énergie consommée sur une période (MWh).'
    - Je souhaite estimer l'énergie électrique totale du tunnel sur la période simulée.
  - - 'Préciser l’objectif : puissance maximale appelée (kW).'
    - Je souhaite estimer la puissance électrique maximale du tunnel au pas de calcul.
  - - 'Préciser l’objectif : énergie par mètre de tunnel (kWh/(m·an)).'
    - Je souhaite obtenir l'énergie annualisée par mètre de tunnel, tous tubes compris.
  results:
    table: kpis.csv
    context_fields:
    - n_days
    - n_runs
    indicators:
    - - total_mwh
      - Énergie sur la période
      - MWh
    - - annualized_mwh
      - Énergie annualisée
      - MWh/an
    - - peak_kw
      - Pic au pas de calcul
      - kW
    - - specific_kwh_m_year
      - Énergie par longueur
      - kWh/(m·an)
    - - load_factor
      - Facteur de charge
      - 1 (sans dimension)
    notes:
    - 'Simulation synthétique : annualisation de la période par 365/durée, sans calibration terrain.'
    url_environment: WEBSEMANTIC_TLS_URL
    headline:
      indicator: annualized_mwh
      template: Dans ce scénario{location}, la consommation annuelle extrapolée est de {value:.2f} MWh/an
        (médiane).
      location_template: ' pour un tunnel à {city}'
    recap_fields:
    - length_m
    - n_tubes
    - n_lanes_per_tube
    - lighting_type
    - ventilation_type
    display_indicators:
    - total_mwh
    - annualized_mwh
    - peak_kw
semantics:
  namespace: tls
  intent_indicators:
    energy_demand: total_mwh
    annual_energy: annualized_mwh
    length_efficiency: specific_kwh_m_year
    peak_demand: peak_kw
interpretation:
  guidance: Pour length_m, citer une longueur en m ou km et conserver le nombre source. Trafic élevé ne
    fixe pas traffic_level. Un éclairage fort/faible ne définit pas lighting_type et ne doit pas devenir
    une puissance inventée. Une comparaison de scénarios exige des configurations séparées. Les comptages
    ont unit:NUM ; start_date et base_seed n’ont pas d’unité physique.
  comparison_tasks:
  - compare configurations (lighting, ventilation, traffic) with controlled seeds
  comparison_message: 'Votre demande contient plusieurs configurations ou plusieurs valeurs pour un même
    paramètre. Le terminal gère actuellement un seul scénario à la fois. Décrivez le scénario A, puis
    le scénario B dans une nouvelle session. Précisez le type d’éclairage : LED adaptive, LED fixed, mixed
    ou sodium fixed. TLS ne possède pas de paramètre d’intensité lumineuse fort/faible dans ce PoC. Aucun
    paramètre courant n’a été modifié.'
  calculation_intent_patterns:
  - \bje (souhaite|veux|voudrais).*obtenir.*(energie|puissance)
  local_rules:
  - patterns:
    - \b(moins|plus|entre|environ)\b
    - \b(km|kilometres?|metres?)\b
    clarify: true
    message: Une borne ou une approximation ne fixe pas une longueur précise. Indiquez une longueur de
      calcul (avec m ou km), ou demandez un profil de démonstration.
  - patterns:
    - \bajaccio\b
    propose_profile: true
    preserve_provided: true
    proposals:
      inputs.altitude_m: 10.0
      inputs.tunnel_context: urban
    source: Ajaccio coastal demonstration proxy, reviewed 2026-10-03. https://www.insee.fr/fr/metadonnees/geographie/commune/2A004-ajaccio
      ; https://www.corse.developpement-durable.gouv.fr/IMG/pdf/210706-dle_finosello_ajacciu.pdf . Local
      study site spans 5.5–18 m NGF; 10 m is a chosen proxy, not a city mean or tunnel observation.
    message: 'Pour un cas urbain littoral à Ajaccio, je propose 10 m d’altitude et un contexte urbain,
      à valider avec /v. Ce sont des hypothèses : 10 m n’est ni l’altitude moyenne d’Ajaccio ni celle
      d’un tunnel identifié. Les valeurs fournies restent prioritaires.'
  - patterns:
    - mix
    - moyenn
    propose_profile: true
    clarify: true
    message: Le profil de démonstration est proposé pour les champs manquants, sans acceptation. Les catégories
      ne se moyennent pas ; vérifiez les choix avec /d puis acceptez les hypothèses avec /v.
  - patterns:
    - (plus|moins).*co[uû]teu|plus.*energet|plus.*energivo
    propose_profile: true
    proposals:
      inputs.lighting_type: sodium fixed
      inputs.ventilation_type: transverse
    alternative:
      pattern: moins
      proposals:
        inputs.lighting_type: LED adaptive
        inputs.ventilation_type: natural/low ventilation
    source: TLS @748e053 category coefficients; scenario proposal, not proof of global optimum.
    message: Je propose les catégories aux coefficients élevés ou faibles dans TLS. /v valide ces hypothèses.
      Ce choix ne prouve pas un optimum énergétique ni la faisabilité technique.
