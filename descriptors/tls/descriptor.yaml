software:
  name: Tunnel Load Simulator
  version: v1.0.1+748e053
  repository: https://github.com/cyrilvoyant/tunnel-load-simulator
  commit: 748e053e129669cf3e896d381e3c0ac01c763edd
  doi: 10.5281/zenodo.20080042
  licence: MIT
  entry_point: tunnel_load_simulator.simulator:run_monte_carlo
  config_class: tunnel_load_simulator.simulator:TunnelConfig
nature: synthetic, first-order Monte Carlo generator; not calibrated against measured tunnels
inputs:
  length_m:
    type: float
    unit: unit:M
    bounds:
      min_exclusive: 0
      authority: code
    label: Longueur
    display_unit: m
    definition: Longueur du tunnel commune aux tubes ; convertie en kilomètres pour les charges proportionnelles
      à la longueur.
    default: 1500
    unit_aliases:
    - m
    - metre
    - metres
    - mètre
    - mètres
    evidence_conversion:
      units:
        km: 1000
        kilometre: 1000
        kilometres: 1000
        m: 1
        metre: 1
        metres: 1
      word_numbers:
        un: 1
        une: 1
        deux: 2
        trois: 3
        quatre: 4
        cinq: 5
        six: 6
        sept: 7
        huit: 8
        neuf: 9
        dix: 10
    quantity_kind: length
    model_component: geometry
    scope_note: Ne pas multiplier la longueur par le nombre de tubes ; ce facteur est appliqué séparément.
    aliases:
    - longueur du tunnel
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_scale:
      reference_upper: 12000.0
      authority: Convention d’essai WebSemantic ; références de curseurs vérifiées dans TLS app.py @748e053e129669cf3e896d381e3c0ac01c763edd.
        Ni limite physique ni calibration terrain.
      interpretation: Valeur de scénario proposée, à valider. Le niveau courant reprend le défaut déclaré
        ; élevé et très élevé utilisent 75 % et 100 % de la référence haute du curseur. Ces niveaux ne
        sont pas des statistiques observées.
      levels:
        faible:
          value: 375.0
          aliases:
          - tunnel court
          - faible longueur
        courant:
          value: 1500
          aliases:
          - longueur courante
        élevé:
          fraction: 0.75
          aliases:
          - tunnel long
          - grande longueur
        très élevé:
          fraction: 1.0
          aliases:
          - tunnel très long
          - très grande longueur
  n_tubes:
    type: int
    unit: unit:NUM
    bounds:
      min: 1
      max: 8
      authority: code
    label: Tubes
    display_unit: nombre
    definition: Nombre de tubes ; multiplie les charges de ventilation et d’auxiliaires et contribue au
      nombre total de voies.
    default: 2
    unit_aliases:
    - null
    - unit:UNITLESS
    - tubes
    - voies
    - nombre
    - number
    - count
    - '1'
    - réalisations
    - realisations
    quantity_kind: count
    model_component: geometry
    scope_note: Un tube est distinct d’une voie de circulation.
    aliases:
    - nombre de tubes
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_scale:
      authority: Convention d’essai WebSemantic ; références de curseurs vérifiées dans TLS app.py @748e053e129669cf3e896d381e3c0ac01c763edd.
        Ni limite physique ni calibration terrain.
      interpretation: Comptages entiers de scénario, à valider ; références discrètes de l’interface TLS,
        pas maxima du moteur.
      levels:
        peu:
          value: 1
          aliases:
          - peu de tubes
        courant:
          value: 2
          aliases:
          - nombre courant de tubes
        beaucoup:
          value: 3
          aliases:
          - beaucoup de tubes
        maximum de référence:
          value: 4
          aliases:
          - énormément de tubes
  n_lanes_per_tube:
    type: int
    unit: unit:NUM
    bounds:
      min: 1
      max: 6
      authority: code
    label: Voies par tube
    display_unit: nombre
    definition: Nombre de voies dans chaque tube ; l’éclairage est dimensionné sur n_tubes × n_lanes_per_tube.
    default: 2
    unit_aliases:
    - null
    - unit:UNITLESS
    - tubes
    - voies
    - nombre
    - number
    - count
    - '1'
    - réalisations
    - realisations
    quantity_kind: count
    model_component: geometry
    scope_note: Ne pas fournir le nombre total de voies à la place du nombre par tube.
    aliases:
    - nombre de voies par tube
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_scale:
      authority: Convention d’essai WebSemantic ; références de curseurs vérifiées dans TLS app.py @748e053e129669cf3e896d381e3c0ac01c763edd.
        Ni limite physique ni calibration terrain.
      interpretation: Comptage par tube, à valider ; ne pas le confondre avec le total de voies.
      levels:
        peu:
          value: 1
          aliases:
          - peu de voies par tube
        courant:
          value: 2
          aliases:
          - nombre courant de voies par tube
        beaucoup:
          value: 3
          aliases:
          - beaucoup de voies par tube
        maximum de référence:
          value: 4
          aliases:
          - énormément de voies par tube
  altitude_m:
    type: float
    unit: unit:M
    label: Altitude
    display_unit: m
    definition: 'Altitude utilisée dans le facteur de ventilation : 1 + max(altitude_m − 500, 0)/6000.'
    default: 300
    unit_aliases:
    - m
    - metre
    - metres
    - mètre
    - mètres
    quantity_kind: length
    model_component: ventilation
    scope_note: Le référentiel altimétrique n’est pas déclaré par le modèle ; l’altitude de la commune
      ne fixe pas celle du tunnel.
    aliases:
    - altitude du tunnel
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_scale:
      reference_upper: 3000.0
      authority: Convention d’essai WebSemantic ; références de curseurs vérifiées dans TLS app.py @748e053e129669cf3e896d381e3c0ac01c763edd.
        Ni limite physique ni calibration terrain.
      interpretation: Valeur de scénario proposée, à valider. Le niveau courant reprend le défaut déclaré
        ; élevé et très élevé utilisent 75 % et 100 % de la référence haute du curseur. Ces niveaux ne
        sont pas des statistiques observées.
      levels:
        faible:
          value: 75.0
          aliases:
          - faible altitude
          - basse altitude
        courant:
          value: 300
          aliases:
          - altitude courante
        élevé:
          fraction: 0.75
          aliases:
          - haute altitude
          - altitude élevée
        très élevé:
          fraction: 1.0
          aliases:
          - très haute altitude
          - altitude très élevée
  max_depth_m:
    type: float
    unit: unit:M
    label: Couverture maximale
    display_unit: m
    definition: 'Profondeur maximale utilisée pour les auxiliaires : facteur 1 + min(max_depth_m, 800)/6000.'
    default: 80
    unit_aliases:
    - m
    - metre
    - metres
    - mètre
    - mètres
    quantity_kind: length
    model_component: auxiliaries
    scope_note: Le plafonnement de l’effet à 800 m n’est pas une limite géométrique de validité physique.
    aliases:
    - profondeur maximale
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_scale:
      reference_upper: 1000.0
      authority: Convention d’essai WebSemantic ; références de curseurs vérifiées dans TLS app.py @748e053e129669cf3e896d381e3c0ac01c763edd.
        Ni limite physique ni calibration terrain.
      interpretation: Valeur de scénario proposée, à valider. Le niveau courant reprend le défaut déclaré
        ; élevé et très élevé utilisent 75 % et 100 % de la référence haute du curseur. Ces niveaux ne
        sont pas des statistiques observées.
      levels:
        faible:
          value: 20.0
          aliases:
          - faible profondeur
          - tunnel peu profond
        courant:
          value: 80
          aliases:
          - profondeur courante
        élevé:
          fraction: 0.75
          aliases:
          - grande profondeur
          - tunnel profond
        très élevé:
          fraction: 1.0
          aliases:
          - très grande profondeur
          - tunnel très profond
  gradient_percent:
    type: float
    unit: unit:PERCENT
    label: Pente
    display_unit: '%'
    definition: Pente en pourcentage, utilisée dans le facteur de ventilation 1 + abs(gradient_percent)/20.
    default: 2.0
    unit_aliases:
    - '%'
    - percent
    - pourcent
    - pourcentage
    quantity_kind: percentage
    model_component: ventilation
    scope_note: Une pente de 2 % se saisit 2, pas 0,02 ; l’adaptateur courant demande une valeur non négative.
    aliases:
    - pente du tunnel
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_scale:
      reference_upper: 12.0
      authority: Convention d’essai WebSemantic ; références de curseurs vérifiées dans TLS app.py @748e053e129669cf3e896d381e3c0ac01c763edd.
        Ni limite physique ni calibration terrain.
      interpretation: Valeur de scénario proposée, à valider. Le niveau courant reprend le défaut déclaré
        ; élevé et très élevé utilisent 75 % et 100 % de la référence haute du curseur. Ces niveaux ne
        sont pas des statistiques observées.
      levels:
        faible:
          value: 0.5
          aliases:
          - faible pente
          - pente faible
        courant:
          value: 2.0
          aliases:
          - pente courante
        élevé:
          fraction: 0.75
          aliases:
          - forte pente
          - pente forte
        très élevé:
          fraction: 1.0
          aliases:
          - très forte pente
          - pente très forte
  tunnel_context:
    type: category
    values:
    - urban
    - peri-urban
    - rural
    authority: code
    label: Contexte
    display_unit: catégorie
    definition: Catégorie appliquant un multiplicateur au profil de trafic ; urban ajoute également une
      composante de pointe en soirée.
    default: peri-urban
    unit_aliases:
    - null
    - ''
    - '1'
    - sans dimension
    - sans unité
    - unit:UNITLESS
    - None
    - 'null'
    - catégorie
    - categorie
    - category
    - categorical
    quantity_kind: category
    model_component: traffic
    scope_note: Le contexte n’est pas une commune et ne constitue pas une calibration du trafic.
    aliases:
    - contexte du tunnel
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_policy: 'Catégories sans ordre universel : utiliser uniquement les catégories déclarées
      et leurs synonymes non ambigus. « Ancien », « moderne », « fort » ou « faible » seuls demandent
      une précision ; l’âge ne détermine pas une technologie ni ses performances.'
  lighting_type:
    type: category
    values:
    - LED adaptive
    - LED fixed
    - mixed
    - sodium fixed
    authority: code
    label: Éclairage
    display_unit: catégorie
    definition: Catégorie déterminant la puissance spécifique installée, le couplage au trafic et la fraction
      minimale d’éclairage.
    default: LED adaptive
    unit_aliases:
    - null
    - ''
    - '1'
    - sans dimension
    - sans unité
    - unit:UNITLESS
    - None
    - 'null'
    - catégorie
    - categorie
    - category
    - categorical
    quantity_kind: category
    model_component: lighting
    scope_note: Même les catégories fixed ont une modulation horaire dans ce modèle ; aucun éclairement
      en lux n’est calculé.
    aliases:
    - type d’éclairage
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_policy: 'Catégories sans ordre universel : utiliser uniquement les catégories déclarées
      et leurs synonymes non ambigus. « Ancien », « moderne », « fort » ou « faible » seuls demandent
      une précision ; l’âge ne détermine pas une technologie ni ses performances.'
  ventilation_type:
    type: category
    values:
    - natural/low ventilation
    - longitudinal
    - semi-transverse
    - transverse
    authority: code
    label: Ventilation
    display_unit: catégorie
    definition: Catégorie déterminant la charge de ventilation par kilomètre et par tube, modulée par
      trafic, altitude, pente et événements.
    default: longitudinal
    unit_aliases:
    - null
    - ''
    - '1'
    - sans dimension
    - sans unité
    - unit:UNITLESS
    - None
    - 'null'
    - catégorie
    - categorie
    - category
    - categorical
    quantity_kind: category
    model_component: ventilation
    scope_note: Il s’agit d’une charge électrique synthétique, pas d’un débit d’air ni d’une vérification
      de sécurité.
    aliases:
    - type de ventilation
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_policy: 'Catégories sans ordre universel : utiliser uniquement les catégories déclarées
      et leurs synonymes non ambigus. « Ancien », « moderne », « fort » ou « faible » seuls demandent
      une précision ; l’âge ne détermine pas une technologie ni ses performances.'
  aux_kw_per_km_tube:
    type: float
    unit: unit:KiloW per km per tube
    label: Auxiliaires
    display_unit: kW/(km·tube)
    definition: Charge de référence des auxiliaires en kW/(km·tube), multipliée par la longueur, les tubes
      et le facteur de profondeur.
    default: 35.0
    unit_aliases:
    - kW par km et par tube
    - kW/(km.tube)
    - kW/(km·tube)
    - kW/km/tube
    quantity_kind: linear_power_per_tube
    model_component: auxiliaries
    scope_note: Ne pas confondre cette charge linéique avec une énergie ; un bruit propre aux auxiliaires
      est ajouté par TLS.
    aliases:
    - charge des auxiliaires
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_scale:
      reference_upper: 120.0
      authority: Convention d’essai WebSemantic ; références de curseurs vérifiées dans TLS app.py @748e053e129669cf3e896d381e3c0ac01c763edd.
        Ni limite physique ni calibration terrain.
      interpretation: Valeur de scénario proposée, à valider. Le niveau courant reprend le défaut déclaré
        ; élevé et très élevé utilisent 75 % et 100 % de la référence haute du curseur. Ces niveaux ne
        sont pas des statistiques observées.
      levels:
        faible:
          value: 8.75
          aliases:
          - faible charge auxiliaire
          - auxiliaires peu puissants
        courant:
          value: 35.0
          aliases:
          - charge auxiliaire courante
        élevé:
          fraction: 0.75
          aliases:
          - forte charge auxiliaire
          - auxiliaires puissants
        très élevé:
          fraction: 1.0
          aliases:
          - très forte charge auxiliaire
          - auxiliaires très puissants
  base_fixed_kw:
    type: float
    unit: unit:KiloW
    label: Charge fixe
    display_unit: kW
    definition: Puissance fixe ajoutée une seule fois à la demande totale du tunnel, avant le bruit multiplicatif
      global.
    default: 40.0
    unit_aliases:
    - kW
    - kilowatt
    - kilowatts
    - kw
    quantity_kind: power
    model_component: base_load
    scope_note: Cette puissance concerne l’ensemble du tunnel, pas chaque tube.
    aliases:
    - charge fixe
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_scale:
      reference_upper: 500.0
      authority: Convention d’essai WebSemantic ; références de curseurs vérifiées dans TLS app.py @748e053e129669cf3e896d381e3c0ac01c763edd.
        Ni limite physique ni calibration terrain.
      interpretation: Valeur de scénario proposée, à valider. Le niveau courant reprend le défaut déclaré
        ; élevé et très élevé utilisent 75 % et 100 % de la référence haute du curseur. Ces niveaux ne
        sont pas des statistiques observées.
      levels:
        faible:
          value: 10.0
          aliases:
          - faible charge fixe
          - charge fixe faible
        courant:
          value: 40.0
          aliases:
          - charge fixe courante
        élevé:
          fraction: 0.75
          aliases:
          - forte charge fixe
          - charge fixe élevée
        très élevé:
          fraction: 1.0
          aliases:
          - très forte charge fixe
          - charge fixe très élevée
  traffic_level:
    type: float
    unit: unit:UNITLESS
    note: relative multiplier
    label: Trafic relatif
    display_unit: '1'
    definition: Multiplicateur du profil synthétique de trafic normalisé ; l’indice final est borné entre
      0 et 2 dans TLS.
    default: 1.0
    unit_aliases:
    - null
    - '1'
    - unit:NUM
    - sans dimension
    - dimensionless
    - UNITLESS
    quantity_kind: dimensionless_multiplier
    model_component: traffic
    scope_note: Ce paramètre n’est ni un débit en véhicules/heure ni un trafic journalier observé.
    aliases:
    - niveau de trafic
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_scale:
      reference_upper: 2.0
      authority: TLS app.py, Global traffic level slider, revision 748e053e129669cf3e896d381e3c0ac01c763edd;
        upper interface reference, not physical capacity or adapter maximum.
      interpretation: 'Convention de scénario autorisée pour les essais : fraction de la référence haute
        2 ; hypothèse à valider, sans comptage local.'
      levels:
        beaucoup:
          fraction: 0.75
          aliases:
          - beaucoup de trafic
          - beaucoup de traffic
          - trafic important
          - trafic élevé
          - fort trafic
        énormément:
          fraction: 1.0
          aliases:
          - énormément de trafic
          - énormément de traffic
          - trafic très élevé
          - trafic énorme
        faible:
          value: 0.3
          aliases:
          - peu de trafic
          - faible trafic
          - trafic faible
        courant:
          value: 1.0
          aliases:
          - trafic courant
  morning_peak_hour:
    type: float
    unit: unit:HR
    label: Pointe du matin
    display_unit: h du jour
    definition: Heure du centre du pic gaussien du matin, comprise entre 0 inclus et 24 exclu.
    default: 8.0
    unit_aliases:
    - h
    - h du jour
    - heure
    - heures
    - hour
    - hours
    quantity_kind: time_of_day
    model_component: traffic
    scope_note: Heure du calendrier simulé ; aucun fuseau horaire ni changement d’heure n’est modélisé.
    aliases:
    - pointe du matin
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_scale:
      authority: Convention d’essai WebSemantic ; références de curseurs vérifiées dans TLS app.py @748e053e129669cf3e896d381e3c0ac01c763edd.
        Ni limite physique ni calibration terrain.
      interpretation: Centre de la pointe en heures du jour, proposé à valider ; ce n’est pas une durée
        ni un horaire local observé.
      levels:
        tôt:
          value: 5
          aliases:
          - pointe du matin tôt
          - pic du matin précoce
        courant:
          value: 8
          aliases:
          - pointe du matin courante
        tard:
          value: 11
          aliases:
          - pointe du matin tardive
          - pic du matin tardif
  evening_peak_hour:
    type: float
    unit: unit:HR
    label: Pointe du soir
    display_unit: h du jour
    definition: Heure du centre du pic gaussien du soir, comprise entre 0 inclus et 24 exclu.
    default: 18.0
    unit_aliases:
    - h
    - h du jour
    - heure
    - heures
    - hour
    - hours
    quantity_kind: time_of_day
    model_component: traffic
    scope_note: Heure du calendrier simulé ; aucun fuseau horaire ni changement d’heure n’est modélisé.
    aliases:
    - pointe du soir
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_scale:
      authority: Convention d’essai WebSemantic ; références de curseurs vérifiées dans TLS app.py @748e053e129669cf3e896d381e3c0ac01c763edd.
        Ni limite physique ni calibration terrain.
      interpretation: Centre de la pointe en heures du jour, proposé à valider ; ce n’est pas une durée
        ni un horaire local observé.
      levels:
        tôt:
          value: 15
          aliases:
          - pointe du soir tôt
          - pic du soir précoce
        courant:
          value: 18
          aliases:
          - pointe du soir courante
        tard:
          value: 22
          aliases:
          - pointe du soir tardive
          - pic du soir tardif
  peak_width_h:
    type: float
    unit: unit:HR
    label: Largeur des pics
    display_unit: h
    definition: Écart-type temporel du pic gaussien du matin en heures ; TLS utilise 1,15 fois cette valeur
      pour le soir.
    default: 1.4
    unit_aliases:
    - h
    - h du jour
    - heure
    - heures
    - hour
    - hours
    quantity_kind: duration
    model_component: traffic
    scope_note: Ce n’est pas la durée totale de la pointe ni sa largeur à mi-hauteur.
    aliases:
    - largeur des pointes
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_scale:
      reference_upper: 4.0
      authority: Convention d’essai WebSemantic ; références de curseurs vérifiées dans TLS app.py @748e053e129669cf3e896d381e3c0ac01c763edd.
        Ni limite physique ni calibration terrain.
      interpretation: Valeur de scénario proposée, à valider. Le niveau courant reprend le défaut déclaré
        ; élevé et très élevé utilisent 75 % et 100 % de la référence haute du curseur. Ces niveaux ne
        sont pas des statistiques observées.
      levels:
        faible:
          value: 0.35
          aliases:
          - pics de trafic étroits
          - pointes étroites
        courant:
          value: 1.4
          aliases:
          - largeur de pointe courante
        élevé:
          fraction: 0.75
          aliases:
          - pics de trafic larges
          - pointes larges
        très élevé:
          fraction: 1.0
          aliases:
          - pics de trafic très larges
          - pointes très larges
  traffic_sensitivity:
    type: float
    unit: unit:UNITLESS
    label: Sensibilité au trafic
    display_unit: '1'
    definition: 'Coefficient du trafic dans la charge de ventilation : facteur 0,15 + traffic_sensitivity
      × traffic_index.'
    default: 0.65
    unit_aliases:
    - null
    - '1'
    - unit:NUM
    - sans dimension
    - dimensionless
    - UNITLESS
    quantity_kind: dimensionless_coefficient
    model_component: ventilation
    scope_note: Coefficient de modèle ; ce n’est pas une élasticité mesurée de consommation.
    aliases:
    - sensibilité au trafic
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_scale:
      reference_upper: 1.5
      authority: Convention d’essai WebSemantic ; références de curseurs vérifiées dans TLS app.py @748e053e129669cf3e896d381e3c0ac01c763edd.
        Ni limite physique ni calibration terrain.
      interpretation: Valeur de scénario proposée, à valider. Le niveau courant reprend le défaut déclaré
        ; élevé et très élevé utilisent 75 % et 100 % de la référence haute du curseur. Ces niveaux ne
        sont pas des statistiques observées.
      levels:
        faible:
          value: 0.1625
          aliases:
          - faible sensibilité au trafic
        courant:
          value: 0.65
          aliases:
          - sensibilité au trafic courante
        élevé:
          fraction: 0.75
          aliases:
          - forte sensibilité au trafic
        très élevé:
          fraction: 1.0
          aliases:
          - très forte sensibilité au trafic
  noise_sigma:
    type: float
    unit: unit:UNITLESS
    bounds:
      min: 0
      authority: code
    label: Bruit multiplicatif
    display_unit: '1'
    definition: Écart-type du bruit gaussien relatif appliqué à la puissance totale ; la puissance résultante
      est ramenée au minimum à zéro.
    default: 0.06
    unit_aliases:
    - null
    - '1'
    - unit:NUM
    - sans dimension
    - dimensionless
    - UNITLESS
    quantity_kind: relative_standard_deviation
    model_component: stochastic
    scope_note: 'D’autres tirages restent actifs même si noise_sigma=0 : trafic quotidien, auxiliaires
      et événements.'
    aliases:
    - bruit relatif
    reference_implementation: simulator.py:simulate_one_realization
    qualitative_scale:
      reference_upper: 0.5
      authority: Convention d’essai WebSemantic ; références de curseurs vérifiées dans TLS app.py @748e053e129669cf3e896d381e3c0ac01c763edd.
        Ni limite physique ni calibration terrain.
      interpretation: Valeur de scénario proposée, à valider. Le niveau courant reprend le défaut déclaré
        ; élevé et très élevé utilisent 75 % et 100 % de la référence haute du curseur. Ces niveaux ne
        sont pas des statistiques observées.
      levels:
        faible:
          value: 0.015
          aliases:
          - faible bruit relatif
          - faible bruit gaussien
        courant:
          value: 0.06
          aliases:
          - bruit relatif courant
        élevé:
          fraction: 0.75
          aliases:
          - fort bruit relatif
          - bruit gaussien élevé
        très élevé:
          fraction: 1.0
          aliases:
          - très fort bruit relatif
          - bruit gaussien très élevé
  pollution_probability_per_day:
