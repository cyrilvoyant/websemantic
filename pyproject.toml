[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websemantic"
version = "0.2.6"
description = "Software-agnostic semantic layer from intent to qualified simulated data (research prototype)"
readme = "docs/pypi.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Cyril Voyant" }]
keywords = ["semantic web", "scientific software", "large language models", "ontology", "SHACL", "provenance", "FAIR"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rdflib>=7.0",
  "pyshacl>=0.26",
  "packaging>=24",
]

[project.urls]
Homepage = "https://www.cyrilvoyant.com"
Repository = "https://github.com/cyrilvoyant/websemantic"
Documentation = "https://github.com/cyrilvoyant/websemantic#readme"
Ontology = "https://w3id.org/websemantic/ns"
DOI = "https://doi.org/10.5281/zenodo.23238902"

[project.optional-dependencies]
tls = ["numpy>=1.24", "pandas>=2.0"]
# Target simulators. TLS and LQL-Equiv are loaded from the pinned submodules in external/.
backends = ["numpy>=1.24", "pandas>=2.0"]
atmosphere = ["numpy", "scipy", "pandas", "polars", "xarray", "netcdf4", "setuptools", "jax==0.11.2", "diffrax==0.7.2", "equinox==0.13.8", "optimistix==0.1.0"]
llm = []  # Gemini uses the Python standard library REST client.
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.18"]

[project.scripts]
websemantic = "websemantic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
websemantic = ["environments.json"]

[tool.ruff]
extend-exclude = ["external"]
