[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websemantic"
version = "0.0.1"
description = "Software-agnostic semantic layer from intent to qualified simulated data (research prototype)"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "Cyril Voyant", email = "cyril.voyant@minesparis.psl.eu" }]
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "rdflib>=7.0",
  "pyshacl>=0.26",
]

[project.optional-dependencies]
tls = ["numpy>=1.24", "pandas>=2.0"]
# Target simulators. TLS and LQL-Equiv are loaded from the pinned submodules in external/.
backends = ["numpy>=1.24", "pandas>=2.0", "pvlib==0.16.1"]
llm = []  # Gemini uses the Python standard library REST client.
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
websemantic = "websemantic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
