# Push the MCP server (mcp-space/) to the Hugging Face Space CyrilVoyant/websemantic-mcp (Gradio, free CPU).
# Needs the repository secret HF_TOKEN_MCP (a Hugging Face token with write access to that Space only).
# The Space gets the same bundle.zip and reading contexts (llm/) as the web app, copied at upload time.
name: Sync MCP Space to Hugging Face

on:
  workflow_dispatch:  # manual only: run after review

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upload mcp-space/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_MCP }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::HF_TOKEN_MCP secret not set: nothing pushed."; exit 1; fi
          cp webapp/bundle.zip mcp-space/ && cp -r webapp/llm mcp-space/
          pip install --quiet huggingface_hub==2.2.0
          python - <<'EOF'
          import os
          from huggingface_hub import upload_folder
          upload_folder(repo_id="CyrilVoyant/websemantic-mcp", repo_type="space", folder_path="mcp-space",
                        ignore_patterns=[".gitignore", "ws/*", "__pycache__/*"],
                        commit_message=f"Sync from github.com/cyrilvoyant/websemantic@{os.environ['GITHUB_SHA'][:7]}",
                        token=os.environ["HF_TOKEN"])
          EOF
