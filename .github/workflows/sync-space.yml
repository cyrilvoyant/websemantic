# Push the static web app (webapp/) to the Hugging Face Space CyrilVoyant/websemantic.
# Needs the repository secret HF_TOKEN (a Hugging Face token with write access to that Space only).
# huggingface_hub stores the binary bundle.zip through the Hub's file storage; a plain git push is refused.
name: Sync Space to Hugging Face

on:
  workflow_dispatch:  # manual only: run after review

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Upload webapp/ to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::HF_TOKEN secret not set: nothing pushed."; exit 1; fi
          pip install --quiet huggingface_hub==2.2.0
          python - <<'EOF'
          import os
          from huggingface_hub import upload_folder
          upload_folder(repo_id="CyrilVoyant/websemantic", repo_type="space", folder_path="webapp",
                        commit_message=f"Sync from github.com/cyrilvoyant/websemantic@{os.environ['GITHUB_SHA'][:7]}",
                        token=os.environ["HF_TOKEN"])
          EOF
